version: '3.8'

services:
  # ── AgentAI Gateway (核心服务) ───────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentai-gateway
    ports:
      - "${PORT:-18789}:18789"
    env_file:
      - .env
    volumes:
      - agentai-data:/app/data          # SQLite数据库 + 进化记忆
      - agentai-memory:/app/.agentai/memory  # 记忆系统
      - agentai-logs:/app/logs          # 日志
      # 2026-10-16 部署加固: 此前只挂了 memory 子目录，而 checkpoints / tasks /
      # worktrees / config 都落在**未挂卷的容器可写层** → 容器重建即全丢。
      # 后果: 会话级 rewind 能力在容器里等于不存在（用户会以为是功能 bug）。
      - agentai-checkpoints:/app/.agentai/checkpoints   # 会话 checkpoint/rewind
      - agentai-tasks:/app/.agentai/tasks               # 长任务快照
      - agentai-worktrees:/app/.agentai/worktrees       # Git worktree 隔离
      - agentai-config:/app/.agentai/config             # 授权范围/审批策略/worktrees.json
      - agentai-cache:/app/.agentai/cache               # 缓存
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/agentai.db
      # 显式声明数据根: 容器内 os.homedir()=/app，但显式声明更清晰，
      # 且与 /v1/system/capabilities 报告的 storage.aiHomeSource 对得上（排障友好）
      - AGENTAI_HOME=/app/.agentai
      # 保持默认 30 天保留; 如需更短释放磁盘, 改这里即可
      - SESSION_CHECKPOINT_RETENTION_DAYS=${SESSION_CHECKPOINT_RETENTION_DAYS:-30}
    # 多副本部署注意: 6 小时清理定时器已加跨进程锁 (.cleanup.lock)，共享卷下
    # 只会有一个实例执行清理，不会互相 rmSync 对方正在用的会话。
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - agentai-net

  # ── Redis (可选缓存) ─────────────────────
  redis:
    image: redis:7-alpine
    container_name: agentai-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - agentai-net
    profiles:
      - redis  # 默认不启动: docker compose --profile redis up

  # ── ChromaDB (可选向量数据库) ─────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: agentai-chromadb
    ports:
      - "${VECTOR_DB_PORT:-8000}:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - agentai-net
    profiles:
      - vector  # 默认不启动: docker compose --profile vector up

volumes:
  agentai-data:
    driver: local
  agentai-memory:
    driver: local
  # 2026-10-16 新增（部署加固）—— 缺任一项都可能导致对应能力在容器重建后失效
  agentai-checkpoints:
    driver: local
  agentai-tasks:
    driver: local
  agentai-worktrees:
    driver: local
  agentai-config:
    driver: local
  agentai-cache:
    driver: local
  agentai-logs:
    driver: local
  redis-data:
    driver: local
  chroma-data:
    driver: local

networks:
  agentai-net:
    driver: bridge
