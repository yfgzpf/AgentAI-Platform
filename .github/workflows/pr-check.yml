name: PR Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  lint-test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 项目是 pnpm workspace（packages/* 有 workspace:* 依赖），
      # 必须用 pnpm 安装；npm 不识别 workspace: 协议，会直接 EUNSUPPORTEDPROTOCOL
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Lint
        run: pnpm run lint
        shell: bash

      - name: Typecheck
        run: pnpm run typecheck
        shell: bash

      - name: Test
        run: pnpm run test
        shell: bash

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          if grep -rE "sk-[a-zA-Z0-9]{32,}|pk-[a-zA-Z0-9]{32,}|AKIA[A-Z0-9]{16}" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --include="*.md" --include="*.yml" .; then
            echo "❌ Found potential secret patterns!"
            exit 1
          fi
          echo "✅ No secrets found"
