<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GitHub 授权回调</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .success { color: #52c41a; }
    .error { color: #ff4d4f; }
    .loading { color: #1890ff; }
    .icon { font-size: 48px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="status" class="loading">
      <div class="icon">⏳</div>
      <h2>正在处理 GitHub 授权...</h2>
      <p>请稍候</p>
    </div>
  </div>

  <script>
    async function handleCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');
      const statusDiv = document.getElementById('status');

      if (error) {
        statusDiv.className = 'error';
        statusDiv.innerHTML = `
          <div class="icon">❌</div>
          <h2>授权失败</h2>
          <p>${error}</p>
        `;
        // 通知父窗口
        if (window.opener) {
          window.opener.postMessage({ type: 'github-oauth-error', error }, '*');
        }
        setTimeout(() => window.close(), 3000);
        return;
      }

      if (!code) {
        statusDiv.className = 'error';
        statusDiv.innerHTML = `
          <div class="icon">❌</div>
          <h2>授权码缺失</h2>
          <p>无法获取授权码</p>
        `;
        setTimeout(() => window.close(), 3000);
        return;
      }

      try {
        // 发送 code 到后端换取 token
        const response = await fetch('/auth/github/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });

        const data = await response.json();

        if (data.success) {
          statusDiv.className = 'success';
          statusDiv.innerHTML = `
            <div class="icon">✅</div>
            <h2>授权成功</h2>
            <p>欢迎，${data.user.name || data.user.login}!</p>
          `;
          // 通知父窗口
          if (window.opener) {
            window.opener.postMessage({ 
              type: 'github-oauth-success', 
              user: data.user 
            }, '*');
          }
          setTimeout(() => window.close(), 2000);
        } else {
          throw new Error(data.error || 'Token exchange failed');
        }
      } catch (err) {
        statusDiv.className = 'error';
        statusDiv.innerHTML = `
          <div class="icon">❌</div>
          <h2>授权失败</h2>
          <p>${err.message}</p>
        `;
        if (window.opener) {
          window.opener.postMessage({ 
            type: 'github-oauth-error', 
            error: err.message 
          }, '*');
        }
        setTimeout(() => window.close(), 3000);
      }
    }

    handleCallback();
  </script>
</body>
</html>
