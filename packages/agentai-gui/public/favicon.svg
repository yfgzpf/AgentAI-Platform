<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 与 src/components/BrandLogo.tsx 同几何 (两条交错流线 + 交点脉冲)。
       2026-10-12 前这里画的是塔尖"A" mark, 与站内 BrandLogo 是两套图形 → 已统一;
       改本文件必须同步改 BrandLogo.tsx, 由 src/brand.test.ts 锁定。 -->
  <defs>
    <linearGradient id="pf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E89055"/>
      <stop offset="100%" stop-color="#CD7A3A"/>
    </linearGradient>
    <linearGradient id="pf-grad-2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#CD7A3A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E89055" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#1a1a22"/>
  <path d="M18 48 C 18 36, 24 28, 24 16" stroke="url(#pf-grad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M46 16 C 46 28, 40 36, 40 48" stroke="url(#pf-grad-2)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="32" cy="32" r="4" fill="#E89055"/>
  <circle cx="32" cy="32" r="2" fill="#fff" opacity="0.9"/>
</svg>
