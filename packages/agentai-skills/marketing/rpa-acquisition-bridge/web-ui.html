<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPA获客控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #e94560;
        }
        .tool-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #0f3460;
        }
        .tool-status:last-child {
            border-bottom: none;
        }
        .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .status.installed {
            background: #00d4ff;
            color: #1a1a2e;
        }
        .status.missing {
            background: #e94560;
            color: #fff;
        }
        .btn {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #ff6b6b;
            transform: translateY(-2px);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #0f3460;
        }
        .btn-secondary:hover {
            background: #1a4a7a;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #0f3460;
            border-radius: 6px;
            background: #0f3460;
            color: #fff;
            font-size: 14px;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        .result {
            background: #0f3460;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .log {
            color: #00d4ff;
        }
        .error {
            color: #e94560;
        }
        .success {
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 RPA获客控制台</h1>
        
        <!-- 工具状态 -->
        <div class="card">
            <div class="card-title">📦 工具安装状态</div>
            <div class="tool-status">
                <span>TagUI (开源脚本)</span>
                <span class="status" id="tagui-status">检查中...</span>
            </div>
            <div class="tool-status">
                <span>Playwright (浏览器)</span>
                <span class="status" id="playwright-status">检查中...</span>
            </div>
            <div class="tool-status">
                <span>Automa (浏览器扩展)</span>
                <span class="status" id="automa-status">检查中...</span>
            </div>
            <div class="tool-status">
                <span>八爪鱼RPA (商业)</span>
                <span class="status" id="bazhuayu-status">检查中...</span>
            </div>
            <button class="btn btn-secondary" onclick="checkTools()">🔄 重新检查</button>
        </div>

        <!-- 快速操作 -->
        <div class="card">
            <div class="card-title">⚡ 快速操作</div>
            <button class="btn" onclick="showForm('xiaohongshu')">📕 发布小红书笔记</button>
            <button class="btn" onclick="showForm('douyin')">🎵 上传抖音视频</button>
            <button class="btn" onclick="showForm('wechat')">💬 回复微信消息</button>
            <button class="btn btn-secondary" onclick="showForm('scrape')">🔍 采集竞品数据</button>
        </div>

        <!-- 任务表单 -->
        <div class="card" id="task-form" style="display: none;">
            <div class="card-title" id="form-title">发布任务</div>
            
            <div class="form-group">
                <label>选择工具</label>
                <select id="tool-select">
                    <option value="automa">Automa (浏览器扩展)</option>
                    <option value="tagui">TagUI (脚本)</option>
                    <option value="playwright">Playwright (Python)</option>
                </select>
            </div>

            <div class="form-group">
                <label>标题</label>
                <input type="text" id="task-title" placeholder="输入标题">
            </div>

            <div class="form-group">
                <label>内容</label>
                <textarea id="task-content" placeholder="输入内容"></textarea>
            </div>

            <div class="form-group" id="image-group">
                <label>图片 (可选)</label>
                <input type="file" id="task-images" multiple accept="image/*">
            </div>

            <button class="btn" onclick="executeTask()">🚀 执行任务</button>
            <button class="btn btn-secondary" onclick="hideForm()">取消</button>
        </div>

        <!-- 执行结果 -->
        <div class="card" id="result-card" style="display: none;">
            <div class="card-title">📊 执行结果</div>
            <div class="result" id="result-content">等待执行...</div>
        </div>
    </div>

    <script>
        // 检查工具状态
        async function checkTools() {
            updateStatus('tagui-status', '检查中...', '');
            updateStatus('playwright-status', '检查中...', '');
            updateStatus('automa-status', '检查中...', '');
            updateStatus('bazhuayu-status', '检查中...', '');

            try {
                const response = await fetch('/api/rpa/check-all');
                const data = await response.json();
                
                updateStatus('tagui-status', 
                    data.tagui.installed ? '已安装' : '未安装',
                    data.tagui.installed ? 'installed' : 'missing');
                
                updateStatus('playwright-status',
                    data.playwright.installed ? '已安装' : '未安装',
                    data.playwright.installed ? 'installed' : 'missing');
                
                updateStatus('automa-status',
                    data.automa.installed ? '已安装' : '未安装',
                    data.automa.installed ? 'installed' : 'missing');
                
                updateStatus('bazhuayu-status',
                    data.bazhuayu.configured ? '已配置' : '未配置',
                    data.bazhuayu.configured ? 'installed' : 'missing');
            } catch (e) {
                console.error('检查失败:', e);
                // 模拟状态
                updateStatus('tagui-status', '未安装', 'missing');
                updateStatus('playwright-status', '未安装', 'missing');
                updateStatus('automa-status', '未安装', 'missing');
                updateStatus('bazhuayu-status', '未配置', 'missing');
            }
        }

        function updateStatus(id, text, className) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = 'status ' + className;
        }

        // 显示表单
        function showForm(type) {
            const form = document.getElementById('task-form');
            const title = document.getElementById('form-title');
            form.style.display = 'block';
            
            const titles = {
                'xiaohongshu': '📕 发布小红书笔记',
                'douyin': '🎵 上传抖音视频',
                'wechat': '💬 回复微信消息',
                'scrape': '🔍 采集竞品数据'
            };
            title.textContent = titles[type] || '执行任务';
        }

        function hideForm() {
            document.getElementById('task-form').style.display = 'none';
        }

        // 执行任务
        async function executeTask() {
            const tool = document.getElementById('tool-select').value;
            const title = document.getElementById('task-title').value;
            const content = document.getElementById('task-content').value;
            
            if (!title || !content) {
                alert('请填写标题和内容');
                return;
            }

            document.getElementById('result-card').style.display = 'block';
            const resultEl = document.getElementById('result-content');
            resultEl.innerHTML = '<span class="log">正在执行...</span>';

            try {
                const response = await fetch('/api/rpa/execute', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        tool: tool,
                        params: {
                            title: title,
                            content: content
                        }
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultEl.innerHTML = `<span class="success">✅ 执行成功</span>\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultEl.innerHTML = `<span class="error">❌ 执行失败</span>\n${data.error || '未知错误'}`;
                }
            } catch (e) {
                resultEl.innerHTML = `<span class="error">❌ 请求失败</span>\n${e.message}`;
            }
        }

        // 初始化
        checkTools();
    </script>
</body>
</html>
